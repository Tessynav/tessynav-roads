name: Build road tiles

on:
  schedule:
    - cron: '0 7 * * 1'      # every Monday, 07:00 UTC (3 AM in Montreal)
  workflow_dispatch:          # the "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium
      - name: Download OpenStreetMap data
        run: python3 build.py download
      - name: Build road tiles
        run: python3 build.py build
      - name: Save tiles to the tiles branch (replaced every week, no history; skipped when the tiles are big)
        run: |
          du -sh out
          if [ "$(du -sm out | cut -f1)" -gt 400 ]; then echo "Tiles over 400 MB: the tiles branch copy is skipped (GitHub Pages still gets them)"; exit 0; fi
          cd out
          git init -q -b tiles
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Road tiles $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tiles
          rm -rf .git
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
