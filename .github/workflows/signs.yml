name: Road signs (Montréal floating signs)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'      # every day, 10:15 UTC (the city updates its list overnight)

permissions:
  contents: write

concurrency:
  group: signs
  cancel-in-progress: false

jobs:
  signs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read the City of Montréal road signs
        run: python3 signs.py
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      - name: Save the signs in the repository (the app reads them from there)
        continue-on-error: true
        run: |
          git config user.name "tessynav-bot"
          git config user.email "tessynav-bot@users.noreply.github.com"
          git add signs/
          git commit -q -m "Road signs $(date -u +%F)" || exit 0
          git pull -q --rebase || true
          git push -q || echo "Could not save the signs"
